<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1960 1100" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="24" fill="#1c1b19">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1c1b19"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8a8a"/>
    </marker>
  </defs>
  <style>
    .box { fill:#fff; stroke:#1c1b19; stroke-width:2.5; rx:14; }
    .lbl { text-anchor:middle; }
    .gray { fill:#8a8a8a; font-style:italic; }
    .it  { font-style:italic; }
    .hd  { font-weight:700; font-size:32px; }
    .solid  { stroke:#1c1b19; stroke-width:2.5; fill:none; marker-end:url(#arr); }
    .dotted { stroke:#8a8a8a; stroke-width:2.5; fill:none; stroke-dasharray:3 7; marker-end:url(#arrg); }
    .dashed { stroke:#1c1b19; stroke-width:2.5; fill:none; stroke-dasharray:14 10; marker-end:url(#arr); }
    .plain  { stroke:#1c1b19; stroke-width:2.5; fill:none; }
  </style>

  <text x="40" y="52" class="hd">脈絡前因</text>
  <text x="1920" y="52" class="hd" text-anchor="end">採用回應模式</text>

  <!-- contextual antecedents -->
  <rect class="box" x="40" y="115" width="245" height="88" rx="14"/>
  <text class="lbl" x="162" y="152">知覺角色</text>
  <text class="lbl" x="162" y="184">脆弱性</text>

  <rect class="box" x="40" y="268" width="245" height="88" rx="14"/>
  <text class="lbl" x="162" y="305">導入決策</text>
  <text class="lbl" x="162" y="337">參與</text>

  <rect class="box" x="40" y="450" width="245" height="88" rx="14"/>
  <text class="lbl" x="162" y="487">言行</text>
  <text class="lbl" x="162" y="519">一致性</text>

  <!-- bracket joining antecedents -->
  <path class="plain" d="M285 159 H325 V494 H285"/>
  <path class="plain" d="M325 312 H360"/>
  <path class="solid" d="M325 312 H395"/>

  <!-- narrative -->
  <rect class="box" x="400" y="262" width="230" height="122" rx="14"/>
  <text class="lbl" x="515" y="303">組織</text>
  <text class="lbl" x="515" y="335">賦能敘事</text>

  <text class="lbl gray" x="705" y="118">組織信任</text>
  <path class="dotted" d="M705 135 V285"/>

  <path class="solid" d="M630 323 H812"/>
  <text class="lbl it" x="712" y="368">賦能敘事反噬</text>

  <!-- frame -->
  <rect class="box" x="820" y="267" width="245" height="110" rx="14"/>
  <text class="lbl" x="942" y="308">「AI 即替代」</text>
  <text class="lbl" x="942" y="340">框架</text>

  <path class="solid" d="M1065 322 H1098"/>

  <!-- primary appraisal -->
  <rect class="box" x="1105" y="258" width="255" height="125" rx="14"/>
  <text class="lbl" x="1232" y="300">初級評估</text>
  <text class="lbl" x="1232" y="332">（偏向威脅）</text>

  <text class="lbl gray" x="1395" y="100">次級評估</text>
  <text class="lbl gray" x="1395" y="130">資源</text>
  <path class="dotted" d="M1395 145 V270 L1408 278"/>

  <path class="solid" d="M1360 295 L1413 272"/>
  <path class="solid" d="M1360 355 L1418 420"/>

  <!-- appraisals -->
  <rect class="box" x="1420" y="228" width="250" height="92" rx="14"/>
  <text class="lbl" x="1545" y="266">角色威脅評估</text>
  <text class="lbl" x="1545" y="298" font-size="0"> </text>

  <rect class="box" x="1425" y="408" width="245" height="92" rx="14"/>
  <text class="lbl" x="1547" y="446">角色機會評估</text>

  <!-- modes -->
  <rect class="box" x="1720" y="103" width="240" height="72" rx="14"/>
  <text class="lbl" x="1840" y="147">迴避</text>

  <rect class="box" x="1715" y="222" width="245" height="118" rx="14"/>
  <text class="lbl" x="1837" y="262">純遵從性使用</text>
  <text class="lbl it" x="1837" y="296" font-size="21">（外部強制要求）</text>

  <rect class="box" x="1720" y="382" width="240" height="90" rx="14"/>
  <text class="lbl" x="1840" y="420">防衛性採用</text>

  <rect class="box" x="1720" y="522" width="240" height="90" rx="14"/>
  <text class="lbl" x="1840" y="560">真正整合</text>

  <path class="solid" d="M1670 250 L1712 165"/>
  <path class="solid" d="M1670 278 H1707"/>
  <path class="solid" d="M1670 305 L1712 400"/>
  <path class="solid" d="M1670 470 L1712 545"/>

  <!-- loop -->
  <rect class="box" x="898" y="562" width="205" height="98" rx="14"/>
  <text class="lbl" x="1000" y="600">更新後的</text>
  <text class="lbl" x="1000" y="632">角色評估</text>

  <rect class="box" x="1168" y="698" width="212" height="126" rx="14"/>
  <text class="lbl" x="1274" y="736">員工—AI 互動</text>
  <text class="lbl" x="1274" y="768">（探測）</text>

  <rect class="box" x="735" y="878" width="430" height="156" rx="14"/>
  <text class="lbl" x="950" y="918">角色相關線索：</text>
  <text class="lbl" x="950" y="950">自指涉＋展示性（AI 生成）；</text>
  <text class="lbl" x="950" y="982">社會傳遞</text>

  <!-- loop arrows (curved) -->
  <path class="solid" d="M1103 622 C1200 640, 1250 660, 1268 694"/>
  <path class="solid" d="M1250 826 C1220 880, 1190 905, 1170 918"/>
  <path class="solid" d="M733 940 C640 880, 640 740, 780 655 C820 632, 860 622, 892 618"/>
  <!-- loop feeds back into primary appraisal -->
  <path class="solid" d="M1020 560 L1195 388"/>

  <text class="lbl it" x="1020" y="700">AI 互動式角色</text>
  <text class="lbl it" x="1020" y="732">意義建構迴圈</text>

  <text class="lbl gray" x="470" y="758">AI 生成線索</text>
  <text class="lbl gray" x="470" y="790">可信度</text>
  <path class="dotted" d="M545 780 L640 800"/>

  <!-- reappraisal pathway -->
  <path class="dashed" d="M1382 742 C1520 700, 1640 630, 1712 574"/>
  <text class="lbl it" x="1590" y="758">再評估路徑</text>

  <!-- legend -->
  <rect x="45" y="880" width="560" height="196" rx="10" fill="none" stroke="#b9b5ad" stroke-width="2"/>
  <text x="70" y="920" font-weight="700">線型</text>
  <path class="solid" d="M70 952 H150"/>
  <text x="170" y="960">主要因果路徑</text>
  <path class="dotted" d="M70 990 H150"/>
  <text x="170" y="998">邊界條件（調節）</text>
  <path class="solid" d="M70 1032 C95 1014, 125 1014, 150 1028"/>
  <text x="170" y="1036">遞迴意義建構迴圈</text>
  <path class="dashed" d="M70 1062 H150"/>
  <text x="170" y="1070">再評估路徑</text>
</svg>
